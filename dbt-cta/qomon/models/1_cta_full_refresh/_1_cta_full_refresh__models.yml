version: 2

models:

  - name: contacts_base
    columns:
      - name: id
        tests:
          - unique
          - not_null

  - name: addresses_base
    columns:
      - name: id
        tests:
          - unique
          - not_null

  - name: profiles_base
    columns:
      - name: id
        tests:
          - unique
          - not_null

  - name: formdata_base
    columns:
      - name: id
        tests:
          - unique
          - not_null

  - name: custom_fields_base
    columns:
      - name: id
        tests:
          - unique
          - not_null

  - name: facts_base
    columns:
      - name: id
        tests:
