version: 2
sources:
  - name: cta
    database: "{{ env_var('CTA_PROJECT_ID', 'not-set') }}"
    schema: "{{ env_var('CTA_DATASET_ID', 'not-set') }}"
    tables:
      - name: regions_base
      - name: tags_base
      - name: ctas_base
      - name: ctas_prompts_base
      - name: ctas_prompts_answers_base
      - name: profiles_base
      - name: profiles_tags_base
      - name: ctas_results_base
      - name: ctas_results_answers_base
      - name: outreach_entries_base
  - name: cta_raw
    database: "{{ env_var('CTA_PROJECT_ID', 'not-set') }}"
    schema: airbyte_internal
    tables:
      - name: "{{ env_var('CTA_DATASET_ID', 'not-set') ~ '_raw__stream_regions' }}"
      - name: "{{ env_var('CTA_DATASET_ID', 'not-set') ~ '_raw__stream_tags' }}"
      - name: "{{ env_var('CTA_DATASET_ID', 'not-set') ~ '_raw__stream_ctas' }}"
      - name: "{{ env_var('CTA_DATASET_ID', 'not-set') ~ '_raw__stream_ctas_prompts' }}"
      - name: "{{ env_var('CTA_DATASET_ID', 'not-set') ~ '_raw__stream_ctas_prompts_answers' }}"
      - name: "{{ env_var('CTA_DATASET_ID', 'not-set') ~ '_raw__stream_profiles' }}"
      - name: "{{ env_var('CTA_DATASET_ID', 'not-set') ~ '_raw__stream_profiles_tags' }}"
      - name: "{{ env_var('CTA_DATASET_ID', 'not-set') ~ '_raw__stream_ctas_results' }}"
      - name: "{{ env_var('CTA_DATASET_ID', 'not-set') ~ '_raw__stream_ctas_results_answers' }}"
      - name: "{{ env_var('CTA_DATASET_ID', 'not-set') ~ '_raw__stream_outreach_entries' }}"
